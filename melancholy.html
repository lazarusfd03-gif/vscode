<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melancholy | Lazante</title>
<link rel="icon" type="image/png" href="images/lazante-logo.png">
<link rel="apple-touch-icon" href="images/lazante-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #d4d4d4; font-family: 'Inter', sans-serif; }
.genre-header { align-items: center; background: rgba(0,0,0,0.94); display: flex; height: 74px; justify-content: space-between; padding: 12px 46px; position: fixed; top: 0; width: 100%; z-index: 10; }
.genre-logo { height: 50px; width: 50px; }
.genre-logo img { display: block; height: 100%; width: 100%; }
.back-link { color: #fff; font-size: 0.9rem; text-decoration: none; }
.genre-hero { align-items: end; background: linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.88)), url('https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?q=80&w=1600') center/cover; display: flex; min-height: 58vh; padding: 130px 10% 70px; }
.genre-hero h1 { color: #fff; font-family: 'Cinzel', serif; font-size: clamp(2.4rem, 6vw, 5rem); letter-spacing: 4px; }
.genre-content { padding: 70px 10%; }
.genre-intro { max-width: 760px; line-height: 1.7; margin-bottom: 42px; }
.track-list { display: grid; gap: 24px; max-width: 980px; }
.track-slot { border: 1px solid rgba(255,255,255,0.14); padding: 24px; }
.track-slot h2 { color: #fff; font-family: 'Cinzel', serif; font-size: 1.2rem; margin-bottom: 18px; }
.audiomack-player { background: #080808; border: 1px solid rgba(255,255,255,0.12); overflow: hidden; }
.audiomack-player iframe { border: 0; display: block; height: 252px; width: 100%; }
@media (max-width: 768px) { .genre-header { padding: 10px 20px; } .genre-content, .genre-hero { padding-left: 20px; padding-right: 20px; } }
</style>
</head>
<body>
<header class="genre-header">
    <a class="genre-logo" href="lazantewebsite.html" aria-label="Back to Lazante home"><img src="images/lazante-logo.png" alt="Lazante"></a>
    <a class="back-link" href="lazantewebsite.html">Back to Home</a>
</header>
<main>
    <section class="genre-hero">
        <h1>Melancholy</h1>
    </section>
    <section class="genre-content">
        <p class="genre-intro">A space for quiet emotion, reflective harmony, restrained atmosphere, and intimate cinematic writing.</p>
        <div class="track-list">
            <div class="track-slot">
                <h2>Track 1</h2>
                <div class="audiomack-player">
                    <iframe src="https://www.audiomack.com/embed/song/lazarusfd03/endoftheworld" scrolling="no" title="End of the World on Audiomack"></iframe>
                </div>
            </div>
            <div class="track-slot">
                <h2>Track 2</h2>
                <div class="audiomack-player">
                    <iframe src="https://www.audiomack.com/embed/song/lazarusfd03/6a160d520b399" scrolling="no" title="Melancholy track 2 on Audiomack"></iframe>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
